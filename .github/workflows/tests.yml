name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest ruff
      - run: python -m compileall -q custom_components tests
      - run: python -m ruff check .
      - run: bash -n setup.sh install.sh verify_setup.sh uninstall.sh
      - run: pytest

  home-assistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            requirement: homeassistant==2025.1.4
            python: "3.13"
          - label: current
            requirement: homeassistant==2026.7.4
            python: "3.14"
    name: Home Assistant ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          "${{ matrix.requirement }}"
          "meshtastic==2.7.11"
          "meshcore==2.3.7"
      - name: Import integration against Home Assistant
        run: |
          python - <<'PY'
          import dbus_fast
          import homeassistant.const
          import custom_components.meshnet.config_flow
          import custom_components.meshnet.coordinator
          import custom_components.meshnet.diagnostics
          import custom_components.meshnet.entities.binary_sensors
          import custom_components.meshnet.entities.device_tracker
          import custom_components.meshnet.entities.sensors
          print("MeshNet Home Assistant and dbus-fast imports passed")
          PY
      - run: python -m pip install pytest
      - run: >-
          pytest -q
          tests/test_config_flow_ha.py
          tests/test_bluetooth_pairing.py
          tests/test_aiomeshtastic_async.py
          tests/test_advanced_backend.py
          tests/test_advanced_controls_frontend.py
          tests/test_advanced_frontend.py
          tests/test_advanced_help_contract.py
          tests/test_meshtastic_ble.py
          tests/test_meshtastic_traceroute_transport.py
          tests/test_ble_runtime_safety.py
          tests/test_clients.py
          tests/test_coordinator.py
          tests/test_diagnostics.py
          tests/test_frontend_panel.py
          tests/test_gateway_settings.py
          tests/test_init.py
          tests/test_mesh_workspace_frontend.py
          tests/test_meshcore_settings.py
          tests/test_meshtastic_settings.py
          tests/test_neighborinfo_projection.py
          tests/test_radio_safety.py
          tests/test_remote_admin_interface.py
          tests/test_remote_admin_safety.py
          tests/test_remote_admin_websocket.py
          tests/test_sensitive_logging.py
          tests/test_entity_sensor_values.py
          tests/test_websocket_api.py
          tests/test_websocket_redaction.py
      - run: python -m pip check
