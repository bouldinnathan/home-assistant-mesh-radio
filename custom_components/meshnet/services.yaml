reboot_gateway_radio:
  fields:
    gateway_id:
      required: false
      selector:
        text:
    delay_seconds:
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
          mode: box

check_remote_node:
  fields:
    gateway_id:
      required: true
      selector:
        text:
    target_node:
      required: true
      example: "!1234abcd"
      selector:
        text:
    minimum_firmware:
      required: false
      default: ""
      example: "2.7.11"
      selector:
        text:

