send_message:
  fields:
    target_node:
      required: false
      selector:
        text:
      example: "!12345678"
    gateway_id:
      required: false
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
      example: "Generator battery low"
    priority:
      required: false
      default: "normal"
      selector:
        select:
          options:
            - normal
            - high
            - emergency
    channel:
      required: false
      selector:
        text:
      example: "0"
    message_type:
      required: false
      default: "broadcast"
      selector:
        select:
          options:
            - direct
            - group
            - broadcast
            - emergency

