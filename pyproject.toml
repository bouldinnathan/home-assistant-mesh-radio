[project]
name = "homeassistant-meshnet"
version = "0.5.4"
description = "Home Assistant custom integration for Meshtastic and MeshCore mesh networks"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# dbus-fast consumes these quoted D-Bus signatures at class creation time.
"custom_components/meshnet/bluetooth_pairing.py" = ["F821"]
